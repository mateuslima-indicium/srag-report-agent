[project]
name = "srag-report-agent"
version = "0.1.0"
description = "GenAI agent that builds an audited SRAG (Sivep-Gripe) report from Open DATASUS data and live news"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Mateus Souto Lima" }]
dependencies = [
    "anthropic>=2.6.0",
    "duckdb>=2.0.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "langchain>=1.4.9",
    "langchain-anthropic>=1.7.10",
    "langgraph>=1.2.20",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "typer>=0.27.3",
]

[project.scripts]
srag-agent = "srag_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/srag_agent"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: tests that call the real Anthropic API (skipped without a key)"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]
